version: "2"

run:
  go: "1.22"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
    - bodyclose
  settings:
    errcheck:
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - third_party$

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
      - third_party$
