name: Release

# Triggered when a version tag (v1.2.3) is pushed.
# Builds cross-platform binaries and publishes a GitHub Release with
# auto-generated release notes.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          # Target matrix: OS/arch pairs.
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for target in "${TARGETS[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            output="dist/helloagents-${VERSION}-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building for ${os}/${arch} -> ${output}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X 'helloagents-go/hello_agents.Version=${VERSION#v}'" \
              -o "$output" ./cmd/helloagents
          done

      - name: Generate archives
        run: |
          cd dist
          for f in helloagents-*; do
            tar -czf "${f}.tar.gz" "$f"
          done

      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.tar.gz | tee checksums-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
